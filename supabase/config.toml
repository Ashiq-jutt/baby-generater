project_id = "babyclip"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "babyclip://"
additional_redirect_urls = ["babyclip://", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # local only; production confirms

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "100MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
